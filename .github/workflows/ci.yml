name: CI — Testes, Sigilo e Instalador

on:
  push:
    branches:
      - main
      - master
      - "task/**"
  pull_request:
    branches:
      - main
      - master
  workflow_dispatch:

concurrency:
  group: ci-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  testes:
    name: Pytest + Sigilo + Pacote (${{ matrix.os }})
    runs-on: ${{ matrix.os }}
    timeout-minutes: 30
    strategy:
      fail-fast: false
      matrix:
        include:
          - os: windows-latest
            ocr_extra: ocr-windows
          - os: macos-15
            ocr_extra: ocr-macos

    steps:
      - name: Checkout do código
        uses: actions/checkout@v4

      - name: Configurar uv e Python 3.12
        uses: astral-sh/setup-uv@v5
        with:
          python-version: "3.12"
          enable-cache: true

      - name: Sincronizar dependências do projeto
        shell: bash
        run: |
          uv sync \
            --extra nuvem \
            --extra seguranca \
            --extra transcricao \
            --extra "${{ matrix.ocr_extra }}" \
            --group dev

      - name: Instalar navegador Chromium (Playwright E2E)
        shell: bash
        run: |
          uv run playwright install chromium

      - name: Verificar sigilo (padrões, CPF, CNJ, caminhos e segredos)
        shell: bash
        run: |
          uv run python scripts/verificar_sigilo.py --apenas-padroes

      - name: Validar empacotamento de distribuição (--dry-run)
        shell: bash
        run: |
          uv run python scripts/build_release.py --dry-run

      - name: Validar scripts shell com ShellCheck (macOS)
        if: runner.os == 'macOS'
        shell: bash
        run: |
          command -v shellcheck >/dev/null 2>&1 || brew install shellcheck
          shellcheck \
            instalador/instalar-mac.sh \
            instalador/desinstalar-mac.sh \
            instalador/bootstrap.sh \
            "Iniciar SentencIA.command" \
            "SentencIA.app/Contents/MacOS/sentencia"

      - name: Executar suíte completa de testes (unitários, integração e E2E)
        shell: bash
        env:
          JVDFM_SECRETS_BACKEND: arquivo
        run: |
          uv run --extra nuvem pytest -q

  instalacao-limpa-macos:
    name: Instalação Limpa macOS (${{ matrix.os }})
    runs-on: ${{ matrix.os }}
    timeout-minutes: 25
    strategy:
      fail-fast: false
      matrix:
        os:
          - macos-15
          - macos-15-intel

    steps:
      - name: Checkout do código
        uses: actions/checkout@v4

      - name: Configurar uv e Python 3.12
        uses: astral-sh/setup-uv@v5
        with:
          python-version: "3.12"
          enable-cache: true

      - name: ShellCheck no instalador macOS
        shell: bash
        run: |
          command -v shellcheck >/dev/null 2>&1 || brew install shellcheck
          shellcheck \
            instalador/instalar-mac.sh \
            instalador/desinstalar-mac.sh \
            instalador/bootstrap.sh

      - name: Gerar pacote local (.zip + SHA256SUMS.txt)
        shell: bash
        run: |
          uv run python scripts/build_release.py

      - name: Executar instalador macOS em pasta limpa e validar /api/health e ocrmac
        shell: bash
        run: |
          ZIP_PATH=""
          for arq in dist/SentencIA-v*.zip; do
            if [ -f "$arq" ]; then
              ZIP_PATH="$arq"
              break
            fi
          done
          if [ -z "$ZIP_PATH" ]; then
            echo "ERRO: pacote .zip não encontrado em dist/." >&2
            exit 1
          fi

          DEST_APP="${RUNNER_TEMP}/SentencIA"
          DEST_BUNDLE="${RUNNER_TEMP}/SentencIA.app"
          DEST_DATA="${RUNNER_TEMP}/SentencIA-data"

          bash instalador/instalar-mac.sh \
            --pacote-local "$ZIP_PATH" \
            --sha256-local dist/SHA256SUMS.txt \
            --destino "$DEST_APP" \
            --app-destino "$DEST_BUNDLE" \
            --dados "$DEST_DATA" \
            --sem-perguntas \
            --sem-iniciar

          test -x "$DEST_APP/.venv/bin/python"
          test -x "$DEST_BUNDLE/Contents/MacOS/sentencia"
          test -x "$DEST_APP/desinstalar.command"

          "$DEST_APP/.venv/bin/python" -c "import ocrmac; print('ocrmac importado com sucesso')"

          export JVDFM_DATA_DIR="$DEST_DATA"
          export JVDFM_PORT="8765"
          "$DEST_APP/.venv/bin/python" "$DEST_APP/launcher.py" --sem-navegador --porta 8765
          curl -fsSL http://127.0.0.1:8765/api/health | grep -q '"status"[[:space:]]*:[[:space:]]*"ok"'
          "$DEST_APP/.venv/bin/python" "$DEST_APP/launcher.py" --parar --porta 8765
